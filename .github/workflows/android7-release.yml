name: Android 7 release APK

on:
  push:
    branches:
      - optimize/android7-tablet
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prod-release:
    name: Build and sign prodRelease only
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: |
          sdkmanager --install "platforms;android-33" "build-tools;30.0.3" "build-tools;33.0.2"

      - name: Assemble production release (no debug or QA APK)
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :WallPanelApp:assembleProdRelease

      - name: Align and sign universal release
        shell: bash
        env:
          INPUT_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          INPUT_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          INPUT_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          INPUT_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          APK_DIR="WallPanelApp/build/outputs/apk/prod/release"
          UNSIGNED="$(find "$APK_DIR" -maxdepth 1 -type f -name '*-unsigned.apk' -print -quit)"
          test -n "$UNSIGNED"
          SIGN_DIR="$RUNNER_TEMP/wallpanel-sign"
          mkdir -p "$SIGN_DIR"
          KEYSTORE="$SIGN_DIR/release.jks"
          if [[ -n "$INPUT_KEYSTORE_BASE64" && -n "$INPUT_KEYSTORE_PASSWORD" && -n "$INPUT_KEY_ALIAS" && -n "$INPUT_KEY_PASSWORD" ]]; then
            printf '%s' "$INPUT_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
            export ANDROID_STORE_PASSWORD="$INPUT_KEYSTORE_PASSWORD"
            export ANDROID_KEY_PASSWORD="$INPUT_KEY_PASSWORD"
            KEY_ALIAS="$INPUT_KEY_ALIAS"
            echo "Release signed with configured keystore" >> "$GITHUB_STEP_SUMMARY"
          else
            export ANDROID_STORE_PASSWORD="$(openssl rand -hex 18)"
            export ANDROID_KEY_PASSWORD="$ANDROID_STORE_PASSWORD"
            KEY_ALIAS="wallpanel"
            keytool -genkeypair -noprompt -v \
              -keystore "$KEYSTORE" -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 3072 -validity 10000 \
              -storepass "$ANDROID_STORE_PASSWORD" -keypass "$ANDROID_KEY_PASSWORD" \
              -dname "CN=WallPanel Android 7, OU=CI, O=WallPanel"
            echo "WARNING: No signing secrets configured; this installable APK uses a temporary signing key. Future releases cannot update it in place unless that key is preserved." >> "$GITHUB_STEP_SUMMARY"
          fi
          ZIPALIGN="$ANDROID_HOME/build-tools/33.0.2/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/33.0.2/apksigner"
          "$ZIPALIGN" -f -p 4 "$UNSIGNED" "$SIGN_DIR/aligned.apk"
          OUTPUT="WallPanel-Android7-prod-release.apk"
          "$APKSIGNER" sign \
            --ks "$KEYSTORE" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:ANDROID_STORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$OUTPUT" "$SIGN_DIR/aligned.apk"
          "$APKSIGNER" verify --verbose --print-certs "$OUTPUT"
          sha256sum "$OUTPUT" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload only production release APK
        uses: actions/upload-artifact@v4
        with:
          name: WallPanel-Android7-prod-release
          path: WallPanel-Android7-prod-release.apk
          if-no-files-found: error
          retention-days: 30
