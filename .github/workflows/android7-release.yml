name: Android 7 release APK

on:
  push:
    branches:
      - optimize/android7-tablet
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  stop-obsolete-build:
    name: Stop obsolete APK build before applying fixes
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Cancel superseded build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          status="$(gh api "repos/$GH_REPO/actions/runs/42643883943" --jq '.status')"
          if [ "$status" != "completed" ]; then
            gh api --method POST "repos/$GH_REPO/actions/runs/42643883943/cancel"
          fi
